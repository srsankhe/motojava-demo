<$tag class="card$card_mod"$href data-type="$type" data-price="$price_num" data-status="$status">
  <div class="photo$photo_mod">$photo
    <span class="chip $chip_class">$chip_text</span>
  </div>
  <div class="card-body">
    <h3 class="h3">$title</h3>
    <p class="spec">$spec</p>
    <div class="card-foot">
      <span class="price$price_mod">$price_html</span>
      $cta_html
    </div>
  </div>
</$tag>
