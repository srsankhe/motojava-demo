<section class="section">
  <div class="container visit-grid">
    <div class="stack">
      <h1 class="h1">Visit the shop</h1>
      <p class="lead">$address_1<br>$address_2</p>
      <p class="measure">$landmarks</p>
      <div class="row">
        <a class="btn btn-primary" href="tel:$tel">Call</a>
        <a class="btn btn-secondary" href="sms:$sms">Text</a>
        <a class="btn btn-secondary" href="mailto:$email">Email</a>
      </div>
      <a class="btn btn-ghost" href="$maps_url" target="_blank" rel="noopener">Open in Google Maps ›</a>
    </div>
    <div class="stack">
      <h2 class="h3">Hours</h2>
      $partial_hours
      <p class="small muted">Sunday and Monday by appointment. Call or text to set one up.</p>
    </div>
  </div>
</section>

<section class="section section-alt">
  <div class="container">
    <div class="section-head">
      <h2>Getting here</h2>
      <a class="btn btn-ghost" href="$maps_url" target="_blank" rel="noopener">Open in Google Maps ›</a>
    </div>
    <div class="map-wrap">
      <iframe class="map-embed" title="Map showing MotoJava at 145 South Van Ness Avenue" src="$osm_embed" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
      <p class="small muted">Map: OpenStreetMap contributors. <a href="$osm_link" target="_blank" rel="noopener">View larger</a>.</p>
    </div>
    <div class="grid" style="margin-top: var(--space-6)">
$directions
    </div>
  </div>
</section>
