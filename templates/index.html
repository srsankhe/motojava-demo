<section class="hero">
  <div class="hero-media">
    <picture>
      <source media="(max-width: 59.99em)" srcset="${root}img/hero-800.webp">
      <img src="${root}img/hero.webp" alt="The MotoJava storefront on South Van Ness Avenue" width="1600" height="1000" fetchpriority="high">
    </picture>
  </div>
  <div class="container hero-body">
    <h1 class="display">$tagline</h1>
    <p class="lead">Every bike is tuned, inspected and ready to ride. San Francisco.</p>
    <div class="row">
      <a class="btn btn-primary" href="#bikes">See the bikes</a>
      <a class="btn btn-secondary" href="tel:$tel">Call $phone</a>
    </div>
  </div>
</section>
